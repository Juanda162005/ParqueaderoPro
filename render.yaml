services:
  - type: web
    name: parqueaderopro-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: HTTPS
        value: "1"
      - key: ENABLE_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
