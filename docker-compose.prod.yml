# ================================================================
#  docker-compose.prod.yml — PRODUCCIÓN FINAL (con HTTPS/SSL)
#  Usa este archivo DESPUÉS de haber ejecutado Certbot.
#  docker compose -f docker-compose.prod.yml up -d --build
# ================================================================

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - HTTPS=1
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - DB_FILE=/app/data/parqueadero.db
      - CORS_ORIGINS=https://parqueaderopro.online,https://www.parqueaderopro.online
      - ENABLE_DOCS=false
    restart: unless-stopped
    volumes:
      - parqueadero_data:/app/data

  web:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  parqueadero_data:
